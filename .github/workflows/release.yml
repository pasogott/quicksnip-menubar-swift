name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release
        run: |
          cd QuickSnip
          xcodebuild -scheme QuickSnip -configuration Release -archivePath build/QuickSnip.xcarchive archive CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO

      - name: Export App
        run: |
          cd QuickSnip
          mkdir -p build/export
          cp -R build/QuickSnip.xcarchive/Products/Applications/QuickSnip.app build/export/

      - name: Create DMG
        run: |
          cd QuickSnip/build/export
          hdiutil create -volname "QuickSnip" -srcfolder QuickSnip.app -ov -format UDZO QuickSnip.dmg

      - name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnip-${{ github.ref_name }}
          path: QuickSnip/build/export/QuickSnip.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: QuickSnip/build/export/QuickSnip.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Use input version for workflow_dispatch, otherwise extract from tag
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          SHA256=$(shasum -a 256 QuickSnip/build/export/QuickSnip.dmg | awk '{print $1}')

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/pasogott/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/quicksnip.rb << CASKEOF
          cask "quicksnip" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/pasogott/quicksnip-menubar-swift/releases/download/v#{version}/QuickSnip.dmg"
            name "QuickSnip"
            desc "Menubar app for managing text snippets with macOS Text Replacement sync"
            homepage "https://github.com/pasogott/quicksnip-menubar-swift"

            depends_on macos: ">= :sequoia"

            app "QuickSnip.app"

            zap trash: [
              "~/.snippets",
              "~/Library/Preferences/com.pasogott.QuickSnip.plist",
            ]
          end
          CASKEOF
          sed -i '' 's/^          //' Casks/quicksnip.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/quicksnip.rb
          git commit -m "Update quicksnip to ${VERSION}"
          git push origin main

